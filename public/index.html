<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 Todo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="app-header">
      <p class="eyebrow" id="today-label">2026년 7월 20일</p>
      <h1 class="greeting">오늘의 할 일 🌤️</h1>
      <p class="subtitle" id="remaining-summary">불러오는 중...</p>
    </header>

    <nav class="day-strip" id="day-strip" aria-label="날짜로 보기"></nav>

    <div class="filter-row">
      <select id="filter-tag">
        <option value="">태그 전체</option>
      </select>
      <select id="filter-completed">
        <option value="">전체</option>
        <option value="0">미완료</option>
        <option value="1">완료</option>
      </select>
      <input type="search" id="filter-search" placeholder="🔍 검색" />
    </div>

    <ol id="todo-list" class="timeline"></ol>
    <p id="empty-state" class="empty-state" hidden>표시할 할 일이 없어요 🌱</p>
  </div>

  <button type="button" id="fab-add" class="fab" aria-label="할 일 추가">+</button>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <form id="add-form" class="add-sheet">
      <div class="add-sheet-handle"></div>
      <h2>새 할 일 🐣</h2>

      <input type="text" id="title" placeholder="할 일 제목" required maxlength="200" />

      <div class="add-sheet-row">
        <label class="labeled-field" for="due-date">
          <span class="labeled-field-label">📅 마감일</span>
          <input type="date" id="due-date" />
        </label>
        <label class="labeled-field" for="reminder-at">
          <span class="labeled-field-label">🔔 알림</span>
          <input type="datetime-local" id="reminder-at" />
        </label>
      </div>

      <input type="text" id="description" placeholder="설명 (선택)" />
      <div id="tag-selector" class="tag-selector"></div>

      <div class="add-sheet-actions">
        <button type="button" id="cancel-add" class="btn-ghost">취소</button>
        <button type="submit" class="btn-primary">추가하기</button>
      </div>
    </form>
  </div>

  <!-- 수정 모달 -->
  <div class="modal-backdrop" id="edit-modal-backdrop" hidden>
    <form id="edit-form" class="add-sheet">
      <div class="add-sheet-handle"></div>
      <h2>할 일 수정 ✏️</h2>

      <input type="hidden" id="edit-id" />
      <input type="text" id="edit-title" placeholder="할 일 제목" required maxlength="200" />

      <div class="add-sheet-row">
        <label class="labeled-field" for="edit-due-date">
          <span class="labeled-field-label">📅 마감일</span>
          <input type="date" id="edit-due-date" />
        </label>
        <label class="labeled-field" for="edit-due-time">
          <span class="labeled-field-label">⏰ 시간</span>
          <input type="time" id="edit-due-time" />
        </label>
      </div>

      <input type="text" id="edit-description" placeholder="설명 (선택)" />
      <div id="edit-tag-selector" class="tag-selector"></div>

      <div class="add-sheet-actions">
        <button type="button" id="cancel-edit" class="btn-ghost">취소</button>
        <button type="submit" class="btn-primary">저장하기</button>
      </div>
    </form>
  </div>

  <!-- 카테고리 관리 모달 -->
  <div class="modal-backdrop" id="category-modal-backdrop" hidden>
    <div class="add-sheet category-sheet">
      <div class="add-sheet-handle"></div>
      <h2>카테고리 관리 🏷️</h2>

      <div class="category-add-row">
        <input type="text" id="new-category-name" placeholder="새 카테고리 이름" />
        <button type="button" id="add-category-btn" class="btn-primary btn-sm">추가</button>
      </div>

      <div id="category-list" class="category-list"></div>

      <div class="add-sheet-actions">
        <button type="button" id="close-category-modal" class="btn-ghost">닫기</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
